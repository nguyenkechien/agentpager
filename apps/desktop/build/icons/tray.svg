<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- {{glyph}} and {{dot}} are replaced by scripts/renderIcons.ts. The screen and the ring around the dot are cut out. -->
  <defs>
    <mask id="body-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#ffffff"/>
      <rect x="15" y="40" width="50" height="34" rx="6" fill="#000000"/>
      <circle cx="78" cy="78" r="29" fill="#000000"/>
    </mask>
    <mask id="ring-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#ffffff"/>
      <circle cx="78" cy="78" r="29" fill="#000000"/>
    </mask>
  </defs>
  <rect x="4" y="28" width="72" height="64" rx="14" fill="{{glyph}}" mask="url(#body-cut)"/>
  <g mask="url(#ring-cut)">
    <path d="M70 12A16 16 0 0 1 86 28" fill="none" stroke="{{glyph}}" stroke-width="9" stroke-linecap="round"/>
    <polyline points="24,48 34,57 24,66" fill="none" stroke="{{glyph}}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="40" y1="66" x2="52" y2="66" stroke="{{glyph}}" stroke-width="7" stroke-linecap="round"/>
  </g>
  <circle cx="78" cy="78" r="21" fill="{{dot}}"/>
</svg>
