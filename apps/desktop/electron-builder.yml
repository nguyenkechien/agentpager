appId: io.github.nguyenkechien.agentpager
productName: agentpager
electronVersion: 44.3.0
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - resources/tray/**
  # The workspace link copies the whole core folder; only its published files belong in the app.
  - '!node_modules/@chiennguyen/agentpager/{src,tests}/**'
  - '!node_modules/@chiennguyen/agentpager/{tsconfig.json,tsconfig.build.json,vitest.config.ts}'
asar: true
asarUnpack:
  # The worker is forked from these files and the Claude Code binary is executed: both need real files.
  - node_modules/@chiennguyen/agentpager/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  # pino transports run in worker threads loaded by file path.
  - node_modules/pino/**
  - node_modules/pino-roll/**
  - node_modules/thread-stream/**
  - node_modules/pino-abstract-transport/**
  - node_modules/sonic-boom/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  # Per-user install in %LOCALAPPDATA%\Programs\agentpager: no admin prompt, and updates replace it in place.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Must stay false: NSIS would delete %APPDATA%\agentpager, the bot's own folder shared with agentpager cli.
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  artifactName: agentpager-Setup-${version}.exe
mac:
  target:
    - target: dmg
  # Ad-hoc signature: required to run on Apple Silicon, no Apple Developer ID. Hardened runtime needs a real identity.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  icon: build/icon-mac.png
  category: public.app-category.developer-tools
dmg:
  artifactName: agentpager-${version}-${arch}.dmg
publish:
  # Uploads go to a draft release; nothing reaches users until the draft is published by hand.
  provider: github
  owner: nguyenkechien
  repo: agentpager
  releaseType: draft
